# Universal AQA Pulse upload job for GitLab CI.
#
# Required GitLab CI/CD variables:
# - AQA_PULSE_BASE_URL
# - AQA_PULSE_WORKSPACE_SLUG
# - AQA_PULSE_WORKSPACE_API_KEY
#
# Optional variables:
# - AQA_PULSE_CONFIG_PATH: config path, default ".aqa-pulse.yml"
# - AQA_PULSE_UPLOAD_ENABLED: set to "false" to skip upload
#
# Minimal usage:
#
# include:
#   - project: 'your-group/AQAPulse'
#     ref: main
#     file: '/aqa-pulse-server/template/gitlab/aqa-pulse-upload.gitlab-ci.yml'
#
# aqa pulse upload:
#   extends: .aqa_pulse_upload_from_config
#   needs:
#     - job: playwright tests
#       artifacts: true

.aqa_pulse_upload_from_config:
  stage: Tests
  image: node:22-bookworm-slim
  variables:
    AQA_PULSE_CONFIG_PATH: ".aqa-pulse.yml"
  script:
    - |
      if [ "${AQA_PULSE_UPLOAD_ENABLED:-true}" != "true" ]; then
        echo "AQA Pulse upload skipped: AQA_PULSE_UPLOAD_ENABLED is not true."
        exit 0
      fi
    - |
      if [ ! -f "$AQA_PULSE_CONFIG_PATH" ]; then
        echo "AQA Pulse upload failed: config not found at $AQA_PULSE_CONFIG_PATH" >&2
        exit 1
      fi
    - npx @aqa-pulse/cli@latest upload-from-config --config "$AQA_PULSE_CONFIG_PATH"
  artifacts:
    when: always
    paths:
      - "**/test-results/dashboard"
  allow_failure: true
